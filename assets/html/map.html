<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header>
        <nav class="nav-bar">
            <p class="name">TRIP <span class="orange">NEP</span></p>

                <input class="destination-input" type="text" placeholder="destination Location">

        </div>

        <div id="map"></div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
