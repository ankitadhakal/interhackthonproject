<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <link rel="stylesheet" href="/assets/css/universal.css">
    <link rel="stylesheet" href="/assets/css/map.css">
    <title>Trip Nep - Map</title>
</head>

<body>
<header>
    <nav class="nav-bar">
        <div class="logo-container">
            <a href="/assets/html/index.html">
                <div class="logo-crop">
                    <img src="/img/logo.jpeg" alt="TripNep Logo" class="logo-img">
                </div>
            </a>
        </div>
        <ul class="nav-list">
            <li><a href="/assets/html/index.html">Home</a></li>
            <li><a href="/assets/html/explore.html">Explore</a></li>
            <li><a href="/assets/html/fair-price.html">Fair Price Index</a></li>
            <li><a href="/assets/html/culture.html">Culture & Etiquette</a></li>
            <li><a href="/assets/html/emergency.html">Emergency SOS</a></li>
            <li><a href="/assets/html/about.html">About Us</a></li>
        </ul>
        <a href="/assets/html/map.html" class="nav-cta">Interactive Map</a>
    </nav>
</header>

    <main class="map-container">
        <div class="controls">
            <div class="input-group startLocation">
                <img src="/img/Gpin.png" alt="Start Pin" class="pin-icon">
                <div class="search-box">
                    <input type="text" id="custom-search" placeholder="Start location (e.g., Pokhara)...">
                </div>
            </div>

            <div class="input-group destination">
                <img src="/img/Rpin.png" alt="Destination Pin" class="pin-icon">
                <div class="search-box">
                    <input type="text" id="destination-search" placeholder="Destination location (e.g., Kathmandu)...">
                </div>
            </div>
        </div>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script src="/assets/js/map.js"></script>
</body>

</html>
